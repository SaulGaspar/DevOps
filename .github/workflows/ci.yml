name: CI/CD SportLike

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.13.1

jobs:
  static-analysis:
    name: 1. Análisis estático
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Revisar estilo
        run: npm run lint
      - name: Comprobar tipos
        run: npm run typecheck
      - name: Validar configuración Expo
        run: npx expo-doctor

  unit-tests:
    name: 2. Pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Ejecutar pruebas unitarias
        run: npm run test:unit

  integration-tests:
    name: 3. Pruebas de integración
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Probar la integración pantalla-servicio-navegación
        run: npm run test:integration

  regression-tests:
    name: 4. Pruebas de regresión y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Ejecutar la suite completa con cobertura
        run: npm run test:regression
      - name: Conservar evidencia de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-pruebas-${{ github.run_number }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  dependency-security:
    name: 5. Seguridad de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Bloquear vulnerabilidades altas o críticas
        run: npm audit --audit-level=high --json > dependency-audit.json
      - name: Conservar reporte de seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-dependencias-${{ github.sha }}
          path: dependency-audit.json
          if-no-files-found: warn

  codeql:
    name: 6. Análisis de seguridad CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Analizar código
        uses: github/codeql-action/analyze@v3

  android-delivery:
    name: 7. Validación de entrega Android
    needs: [static-analysis, unit-tests, integration-tests, regression-tests, dependency-security, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Generar paquete exportable para Android
        run: npm run export:android
      - name: Publicar artefacto de entrega
        uses: actions/upload-artifact@v4
        with:
          name: sportlike-android-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
