name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches:
      - develop
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar estilo
        run: npm run lint

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Ejecutar pruebas funcionales
        run: npm test

      - name: Diagnosticar configuración Expo
        run: npx expo-doctor

      - name: Verificar paquete Android
        run: npm run export:android

      - name: Revisar dependencias de alto riesgo
        run: npm audit --audit-level=high

  codeql:
    name: Análisis de seguridad CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analizar código
        uses: github/codeql-action/analyze@v3
