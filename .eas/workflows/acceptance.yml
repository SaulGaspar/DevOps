name: Aceptación móvil Android e iOS

# Ejecutar manualmente antes de aprobar release; requiere proyecto EAS vinculado.
jobs:
  build_android:
    type: build
    params:
      platform: android
      profile: e2e-test
  build_ios:
    type: build
    params:
      platform: ios
      profile: e2e-test
  acceptance_android:
    needs: [build_android]
    type: maestro
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path: ['.maestro/auth-navigation.yml']
  acceptance_ios:
    needs: [build_ios]
    type: maestro
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path: ['.maestro/auth-navigation.yml']
